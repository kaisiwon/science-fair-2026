<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathQuest - Fraction Farmer</title>
    <link rel="manifest" href="./manifest.json" crossorigin="use-credentials">
    <link rel="icon" type="image/png" href="./icon.png">
    <link rel="stylesheet" href="fraction-farmer.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>Fraction Farmer</h1>
            <div class="score-container">
                Score: <span id="score">0</span> | Money: <span id="money">0</span>
            </div>
        </header>
        <main class="game-board">
            <div id="watering-can-container">
                <!-- Watering cans will be generated here -->
            </div>
            <div id="task-container">
                <p>Plant <span id="fraction-task">1/4</span> of the field with carrots.</p>
            </div>
            <div id="field-grid" class="grid-container">
                <!-- Grid cells will be generated by JavaScript -->
            </div>
            <button id="harvest-btn">Harvest</button>

            <section class="game-section" id="trade-market-section">
                <h2>Trade Market</h2>
                <div id="trade-offers">
                    <!-- Trade offers will be generated here -->
                    <p>No trade offers available yet.</p>
                </div>
            </section>

            <section class="game-section" id="upgrades-section">
                <h2>Upgrades</h2>
                <div id="available-upgrades">
                    <!-- Upgrades will be generated here -->
                    <p>No upgrades available yet.</p>
                </div>
            </section>

            <a href="game-select.html" class="back-link">Back to Game Select</a>
        </main>
    </div>
    <script src="fraction-farmer.js"></script>
</body>
</html>
