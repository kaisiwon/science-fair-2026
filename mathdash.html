            margin: 0;
            padding: 0;
            background-color: #111;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background-color: #1a1a2e;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            border: 4px solid #333;
        }
        #instructions {
            margin-top: 15px;
            text-align: center;
            color: #aaa;
        }
        #preloader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #111;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }
    </style>
</head>

            assetsLoaded++;
            const percent = (assetsLoaded / totalAssets) * 100;
            loadingBar.style.width = percent + '%';
            
            if (assetsLoaded >= totalAssets) {

                startBtn.style.display = 'block';
            }

            img.onerror = updateProgress;

        // Fallback just in case the audio event doesn't fire fast enough
        setTimeout(() => { if (assetsLoaded < totalAssets) { assetsLoaded = totalAssets - 1; updateProgress(); } }, 5000);

        function checkSkinUnlocks(event, data) {
            let newlyUnlocked = [];
            skins.forEach(skin => {
                if (unlockedSkins.includes(skin.id)) return;
                let unlock = false;
                if (skin.id === 'novice' && event === 'progress' && data >= 25) unlock = true;
                if (skin.id === 'advanced' && event === 'progress' && data >= 50) unlock = true;
                if (skin.id === 'expert' && event === 'progress' && data >= 100) unlock = true;
                if (skin.id === 'creator' && event === 'editor') unlock = true;
                
                if (unlock) {
                    unlockedSkins.push(skin.id);
                    localStorage.setItem("gd_unlocked_skins", JSON.stringify(unlockedSkins));
                    newlyUnlocked.push(skin);
                }
            });
            if (newlyUnlocked.length > 0) {
                newUnlockedSkinQueue.push(...newlyUnlocked);
            }
        }

        // --- LEVEL PARSER ---
        function loadLevel(catIndex, lvlIndex) {
            obstacles = [];
            const layout = levelCategories[catIndex].levels[lvlIndex].layout;
            
            // Set up level music
            currentMenuMusicUrl = ""; // Reset menu music state
            if (fadeInterval) clearInterval(fadeInterval);
            bgMusic.volume = 1;
            bgMusic.pause();
            if (isPracticeMode) {
                bgMusic.src = "./assets/535331_stay-inside-me.mp3";
            } else if (levelCategories[catIndex].levels[lvlIndex].audioUrl) {
                bgMusic.src = levelCategories[catIndex].levels[lvlIndex].audioUrl;
            } else {
                bgMusic.removeAttribute('src');
            }

            for (let row = 0; row < layout.length; row++) {
                for (let col = 0; col < layout[row].length; col++) {
                    const char = layout[row][col];
                    const x = col * TILE_SIZE;
                    const y = row * TILE_SIZE;

                    if (char === 'X') {
                        obstacles.push({ type: 'block', x, y, w: TILE_SIZE, h: TILE_SIZE });
                    } else if (char === '^') {
                        obstacles.push({ type: 'spike', x, y, w: TILE_SIZE, h: TILE_SIZE });
                    } else if (char === '.') {
                        obstacles.push({ type: 'halfSpike', x, y: y + TILE_SIZE / 2, w: TILE_SIZE, h: TILE_SIZE / 2 });
                    } else if (char === 'v') {
                        obstacles.push({ type: 'spikeDown', x, y, w: TILE_SIZE, h: TILE_SIZE });
                    } else if (char === ',') {
                        obstacles.push({ type: 'halfSpikeDown', x, y, w: TILE_SIZE, h: TILE_SIZE / 2 });
                    } else if (char === 'O') {
                        obstacles.push({ type: 'orb', x, y, w: TILE_SIZE, h: TILE_SIZE });
                    } else if (char === 'D') {
                        obstacles.push({ type: 'dashOrb', x, y, w: TILE_SIZE, h: TILE_SIZE });
                    } else if (char === '>') {
                        obstacles.push({ type: 'portalShip', x, y: y - TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE * 3 });
                    } else if (char === 'U') {
                        obstacles.push({ type: 'portalUFO', x, y: y - TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE * 3 });
                    } else if (char === 'W') {
                        obstacles.push({ type: 'portalWave', x, y: y - TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE * 3 });
                    } else if (char === 'Q') {
                        obstacles.push({ type: 'portalBall', x, y: y - TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE * 3 });
                    } else if (char === '<') {
                        obstacles.push({ type: 'portalCube', x, y: y - TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE * 3 });
                    } else if (char === 'Y') {
                        obstacles.push({ type: 'portalGravityInvert', x, y: y - TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE * 3 });
                    } else if (char === 'B') {
                        obstacles.push({ type: 'portalGravityNormal', x, y: y - TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE * 3 });
                    } else if (char === 'P') {
                        obstacles.push({ type: 'pad', x, y: y + TILE_SIZE * 0.75, w: TILE_SIZE, h: TILE_SIZE * 0.25 });
                    } else if (char === 'R') {
                        obstacles.push({ type: 'redPad', x, y: y + TILE_SIZE * 0.75, w: TILE_SIZE, h: TILE_SIZE * 0.25 });
                    } else if (char === 'C') {
                        obstacles.push({ type: 'coin', x, y: y + TILE_SIZE / 4, w: TILE_SIZE / 2, h: TILE_SIZE / 2, collected: false });
                    } else if (char === '@') {
                        levelEnd = x;
                    }
                }
            }
            if (levelEnd === 0) {
                levelEnd = obstacles.length > 0 ? Math.max(...obstacles.map(o => o.x)) + 800 : 800;
            }
            resetPlayer();
        }

            currentZoom = 0.6; // Start zoomed out to see more of the level initially

            targetZoom = 1;
            coins = 0;
            particles = [];
            for (let obs of obstacles) {
                if (obs.type === 'coin') obs.collected = false;
                if (obs.type === 'orb' || obs.type === 'dashOrb') obs.hit = false; // Reset orbs
            }
        }

        function loadCheckpoint() {
            if (checkpoints.length > 0) {
                const cp = checkpoints[checkpoints.length - 1];
                player.x = cp.x;
                player.y = cp.y;
                player.dy = 0;
                player.dx = (SPEED * TILE_SIZE) / 60;
                player.rotation = cp.rotation;
                player.mode = cp.mode;
                player.gravity = cp.gravity;
                player.isDashing = false;
                cameraX = cp.cameraX;
                currentZoom = cp.currentZoom || 1;
                targetZoom = cp.targetZoom || 1;
                particles = [];
                bgMusic.currentTime = cp.musicTime || 0;
                
                if (player.mode === 'cube') {
                    player.w = 30; player.h = 30;
                } else if (player.mode === 'ship') {
                    player.w = 45; player.h = 15;
                } else if (player.mode === 'ufo') {
                    player.w = 40; player.h = 24;
                } else if (player.mode === 'wave') {
                    player.w = 20; player.h = 20;
                } else if (player.mode === 'ball') {
                    player.w = 30; player.h = 30;
                }
            } else {
                resetPlayer();
            }
        }

        function openEditor(existingLayout = null) {
            checkSkinUnlocks('editor', null);
            gameState = "EDITOR";
            editorCameraX = 0;
            bgMusic.pause();
            if (existingLayout) {
                editorLayout = Array.from({length: 10}, (_, r) => {
                    let rowStr = existingLayout[r] || "";
                    let arr = rowStr.split('');
                    while(arr.length < 200) arr.push(' ');
                    return arr;
                });
            } else {
                editorLayout = Array.from({length: 10}, () => Array(200).fill(' '));
            }
        }

        function saveAndPlayEditor() {
            let newLayoutStr = editorLayout.map(row => row.join('').replace(/\s+$/, ''));
            if (editingLevelIndex !== -1 && currentCategoryIndex === 0 && levelCategories[0].levels[editingLevelIndex].isUserCreated) {
                levelCategories[0].levels[editingLevelIndex].layout = newLayoutStr;
            } else {
                let newLevel = {
                    name: "Custom Level " + (levelCategories[0].levels.length + 1),
                    song: "Custom Level",
                    audioUrl: "",
                    bgColor: "#1a1a2e",
                    blockColor: "#0f3460",
                    layout: newLayoutStr,
                    isUserCreated: true
                };
                levelCategories[0].levels.push(newLevel);
                currentCategoryIndex = 0;
                editingLevelIndex = levelCategories[0].levels.length - 1;
            }
            currentLevelIndex = editingLevelIndex;
            
            localStorage.setItem("gd_custom_levels", JSON.stringify(levelCategories[0].levels.filter(l => l.isUserCreated)));

            attempts = 1;
            isPracticeMode = false;
            checkpoints = [];
            loadLevel(currentCategoryIndex, currentLevelIndex);
            gameState = "PLAYING";
            if (bgMusic.src) bgMusic.play().catch(e => {});
        }

        function paintEditor(mx, my) {
            if (my > 40) {
                let col = Math.floor((mx + editorCameraX) / TILE_SIZE);
                let row = Math.floor(my / TILE_SIZE);
                if (row >= 0 && row < 10 && col >= 0) {
                    while(col >= editorLayout[row].length) {
                        for(let r=0; r<10; r++) editorLayout[r].push(' ');
                    }
                    editorLayout[row][col] = brushes[currentBrushIndex].char;
                }
            }
        }

        function placeCheckpoint() {
            if (gameState === "PLAYING" && isPracticeMode && player.grounded) {
                checkpoints.push({
                    x: player.x,
                    y: player.y,
                    rotation: player.rotation,
                    mode: player.mode,
                    gravity: player.gravity,
                    cameraX: cameraX,
                    currentZoom: currentZoom,
                    targetZoom: targetZoom,
                    musicTime: bgMusic.currentTime
                });
            }
        }

        function removeCheckpoint() {
            if (gameState === "PLAYING" && isPracticeMode && checkpoints.length > 0) {
                checkpoints.pop();
            }
        }

        function die() {
            if (gameState === "DEAD") return;
            gameState = "DEAD";
            attempts++;
            bgMusic.pause();
            if (!isPracticeMode || checkpoints.length === 0) {
                bgMusic.currentTime = 0;
            }
            
            crashSound.currentTime = 0;
            crashSound.play().catch(e => console.log("Crash sound play failed", e));
            
            // Automatic respawn after 0.8 seconds
            setTimeout(() => {
                if (skinUnlockPopup) {
                    const waitForPopup = setInterval(() => {
                        if (!skinUnlockPopup) {
                            clearInterval(waitForPopup);
                            doRespawn();
                        }
                    }, 100);
                    return;
                }
                doRespawn();
            }, 800);
            
            function doRespawn() {
                if (isPracticeMode && checkpoints.length > 0) {
                    loadCheckpoint();
                } else {
                    resetPlayer();
                }
                gameState = "PLAYING";
                if (bgMusic.src) bgMusic.play().catch(e => console.log("Audio play failed", e));
            }
        }

        function playMenuMusic(musicUrl) {
            const targetMusic = musicUrl || "./assets/title_theme.mp3";
            if (currentMenuMusicUrl !== targetMusic) {
                currentMenuMusicUrl = targetMusic;
                
                if (fadeInterval) clearInterval(fadeInterval);
                
                const startFadeIn = () => {
                    bgMusic.pause();
                    bgMusic.src = targetMusic;
                    bgMusic.volume = 0;
                    bgMusic.play().catch(e => console.log("Menu music play failed", e));
                    
                    fadeInterval = setInterval(() => {
                        if (bgMusic.volume < 0.9) {
                            bgMusic.volume = Math.min(1, bgMusic.volume + 0.1);
                        } else {
                            bgMusic.volume = 1;
                            clearInterval(fadeInterval);
                        }
                    }, 50);
                };

                if (!bgMusic.paused && bgMusic.src) {
                    fadeInterval = setInterval(() => {
                        if (bgMusic.volume > 0.1) {
                            bgMusic.volume = Math.max(0, bgMusic.volume - 0.1);
                        } else {
                            bgMusic.volume = 0;
                            clearInterval(fadeInterval);
                            startFadeIn();
                        }
                    }, 50);
                } else {
                    startFadeIn();
                }
            } else if (bgMusic.paused) {
                if (fadeInterval) clearInterval(fadeInterval);
                bgMusic.volume = 1;
                bgMusic.play().catch(e => console.log("Menu music play failed", e));
            }
        }

        function returnToMenu() {
            gameState = "START";
            menuState = "CATEGORY_SELECT";
            playMenuMusic();
        }

        // --- INPUT HANDLING ---
        function jump() {
            if (gameState === "COMPLETE" || gameState === "ALL_CLEAR") {
                returnToMenu();
            } else if (gameState === "PLAYING") {
                // Check if we are currently intersecting an un-hit orb
                let hitOrb = false;
                for (let obs of obstacles) {
                    if ((obs.type === 'orb' || obs.type === 'dashOrb') && !obs.hit) {
                        let hitBox = { x: obs.x - 15, y: obs.y - 15, w: obs.w + 30, h: obs.h + 30 };
                        if (player.x < hitBox.x + hitBox.w && 
                            player.x + player.w > hitBox.x && 
                            player.y < hitBox.y + hitBox.h && 
                            player.y + player.h > hitBox.y) {
                            
                            if (obs.type === 'orb') {
                                player.dy = JUMP_FORCE * player.gravity;
                                player.grounded = false;
                                player.isDashing = false;
                                obs.hit = true; // Mark as hit so it flashes
                                setTimeout(() => obs.hit = false, 300); // Allow reuse after 300ms
                                hitOrb = true;
                                player.jumpBuffered = false;
                                break;
                            } else if (obs.type === 'dashOrb') {
                                player.isDashing = true;
                                player.dy = 0;
                                player.grounded = false;
                                obs.hit = true;
                                setTimeout(() => obs.hit = false, 300);
                                hitOrb = true;
                                player.jumpBuffered = false;
                                break;
                            }
                        }
                    }
                }

                // If no orb was hit, do a normal ground jump or buffer it
                if (!hitOrb) {
                    if (player.mode === 'cube') {
                        if (player.grounded) {
                            player.dy = JUMP_FORCE * player.gravity;
                            player.grounded = false;
                        } else {
                            player.jumpBuffered = true;
                            if (jumpBufferTimeout) clearTimeout(jumpBufferTimeout);
                            jumpBufferTimeout = setTimeout(() => player.jumpBuffered = false, 150);
                        }
                    } else if (player.mode === 'ball') {
                        if (player.grounded) {
                            player.gravity *= -1;
                            player.grounded = false;
                        } else {
                            player.jumpBuffered = true;
                            if (jumpBufferTimeout) clearTimeout(jumpBufferTimeout);
                            jumpBufferTimeout = setTimeout(() => player.jumpBuffered = false, 150);
                        }
                    } else if (player.mode === 'ufo') {
                        player.dy = JUMP_FORCE * 0.8 * player.gravity; // Weaker mid-air hop
                        player.grounded = false;
                    }
                }
            }
        }

        window.addEventListener("keydown", (e) => { 
            keys[e.code] = true;
            if (e.code === "Escape" || e.code === "KeyP") {
                if (gameState === "PLAYING") {
                    gameState = "PAUSED";
                    bgMusic.pause();
                } else if (gameState === "PAUSED") {
                    gameState = "PLAYING";
                    bgMusic.play().catch(e => console.log("Audio play failed", e));
                }
            } else if (e.code === "Space") { 
                if (gameState === "START") {
                    if (menuState === "CATEGORY_SELECT") {
                        currentLevelIndex = 0;
                        menuScrollX = 0;
                        menuState = "LEVEL_SELECT";
                        playMenuMusic(levelCategories[currentCategoryIndex].menuMusic);
                    } else if (menuState === "LEVEL_SELECT") {
                        attempts = 1;
                        isPracticeMode = false;
                        checkpoints = [];
                        loadLevel(currentCategoryIndex, currentLevelIndex);
                        gameState = "PLAYING";
                        if (bgMusic.src) bgMusic.play().catch(e => console.log("Audio play failed", e));
                    }
                } else {
                    isHolding = true; 
                    jump(); 
                }
            } else if (e.code === "ArrowLeft" || e.code === "KeyA") {
                if (gameState === "START" && menuState === "LEVEL_SELECT") {
                    const levels = levelCategories[currentCategoryIndex].levels;
                    if (levels.length > 1) {
                        currentLevelIndex = (currentLevelIndex - 1 + levels.length) % levels.length;
                    }
                } else if (gameState === "START" && menuState === "SKIN_SELECT") {
                    if (skins.length > 1) currentSkinIndex = (currentSkinIndex - 1 + skins.length) % skins.length;
                }
            } else if (e.code === "ArrowRight" || e.code === "KeyD") {
                if (gameState === "START" && menuState === "LEVEL_SELECT") {
                    const levels = levelCategories[currentCategoryIndex].levels;
                    if (levels.length > 1) {
                        currentLevelIndex = (currentLevelIndex + 1) % levels.length;
                    }
                } else if (gameState === "START" && menuState === "SKIN_SELECT") {
                    if (skins.length > 1) currentSkinIndex = (currentSkinIndex + 1) % skins.length;
                }
            } else if (e.code === "KeyZ") {
                placeCheckpoint();
            } else if (e.code === "KeyX") {
                removeCheckpoint();
            }
        });
        window.addEventListener("keyup", (e) => { 
            keys[e.code] = false;
            if (e.code === "Space") isHolding = false; 
        });
        window.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        if (gameState === "START" && menuState === "SKIN_SELECT") {
            hoveredSkinIndex = -1;
            for (let i = 0; i < skins.length; i++) {
                if (i < skinPage * 12 || i >= (skinPage + 1) * 12) continue;
                const idxOnPage = i % 12;

                const row = Math.floor(idxOnPage / 4);

                    break;
                }
            }
        } else if (gameState === "START" && menuState === "SHOP") {
            hoveredShopIndex = -1;
            const shopSkins = skins.filter(s => s.cost);
            for (let i = 0; i < shopSkins.length; i++) {
                if (i < shopPage * 12 || i >= (shopPage + 1) * 12) continue;
                const idxOnPage = i % 12;
                const col = idxOnPage % 4;
                const row = Math.floor(idxOnPage / 4);
                const boxX = 80 + col * 70;
                const boxY = 140 + row * 70;
                if (mouseX >= boxX && mouseX <= boxX + 50 && mouseY >= boxY && mouseY <= boxY + 50) {
                    hoveredShopIndex = i;
                    break;
                }
            }
        }

            if (gameState === "EDITOR" && isPaintingEditor) {
                paintEditor(e.clientX - rect.left, e.clientY - rect.top);
            }
        });
        window.addEventListener("mousedown", (e) => { 
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (skinUnlockPopup) {
                if (mouseX >= canvas.width/2 - 110 && mouseX <= canvas.width/2 - 10 && mouseY >= 250 && mouseY <= 290) {
                    equippedSkin = skinUnlockPopup.id;
                    localStorage.setItem("gd_equipped_skin", equippedSkin);
                    skinUnlockPopup = null;
                } else if (mouseX >= canvas.width/2 + 10 && mouseX <= canvas.width/2 + 110 && mouseY >= 250 && mouseY <= 290) {
                    skinUnlockPopup = null;
                }
                return;
            }

            if (gameState === "EDITOR") {
                if (mouseY <= 40) {
                    if (mouseX >= 10 && mouseX <= 110) saveAndPlayEditor();
                    else if (mouseX >= 120 && mouseX <= 180) returnToMenu();
                    else if (mouseX >= 200) {
                        let index = Math.floor((mouseX - 200) / 40);
                        if (index >= 0 && index < brushes.length) currentBrushIndex = index;
                    }

                    paintEditor(mouseX, mouseY);
                }

            }

            if (gameState === "START") {

                    for (let i = 0; i < levelCategories.length; i++) {

                        const btnY = 140 + i * 60;

                            currentCategoryIndex = i;
                            currentLevelIndex = 0;
                            menuScrollX = 0;
                            menuState = "LEVEL_SELECT";
                            playMenuMusic(levelCategories[currentCategoryIndex].menuMusic);
                            return;
                        }
                    }
                    
                    const editorBtnY = 140 + levelCategories.length * 60 + 20;
                    if (mouseY >= editorBtnY && mouseY <= editorBtnY + 45) {
                        if (mouseX >= canvas.width / 2 - 150 && mouseX <= canvas.width / 2 - 10) {

                isHolding = true; 
                jump();
            } else {
                isHolding = true; 
                jump();
            }
        });
        window.addEventListener("mouseup", () => { 
            isHolding = false; 
            isPaintingEditor = false;
        });

        // --- PHYSICS & COLLISION ---
        function update() {
            if (gameState === "EDITOR") {
                if (keys["ArrowLeft"] || keys["KeyA"]) editorCameraX = Math.max(0, editorCameraX - 15);
                if (keys["ArrowRight"] || keys["KeyD"]) editorCameraX += 15;
                return;
            }
            if (gameState !== "PLAYING") return;

            // --- DYNAMIC ZOOM LOGIC ---
            let baseZoom = 0.7;
            if (player.mode === 'ship') baseZoom = 0.55; // Zoom out more for ship
            else if (player.mode === 'ufo') baseZoom = 0.65;
            else if (player.mode === 'wave') baseZoom = 0.7;
            else if (player.mode === 'ball') baseZoom = 0.85; // Zoom in more for ball

            let colorZoomOffset = 0;
            const currentLevel = levelCategories[currentCategoryIndex].levels[currentLevelIndex];
            if (currentLevel && currentLevel.bgColor) {
                if (currentLevel.bgColor.match(/^#[0-2]/)) {
                    colorZoomOffset = 0.08; // Darker backgrounds zoom in slightly more
                }
            }
            
            let densityZoomOffset = 0;
            let incomingObstacles = 0;
            let portalIncoming = false;
            const zoomLookahead = 800; // Look further ahead for obstacles
            for (let obs of obstacles) {
                if (obs.x > player.x && obs.x < player.x + zoomLookahead) {
                    incomingObstacles++;
                    if (obs.type && obs.type.startsWith('portal')) portalIncoming = true;
                }
            }
            
            if (portalIncoming) densityZoomOffset += 0.25; // More dramatic zoom for portals
            else if (incomingObstacles > 20) densityZoomOffset -= 0.15; // Zoom out more to see dense sections
            else if (incomingObstacles < 4) densityZoomOffset += 0.1; // Zoom in more when space is empty
            
            targetZoom = Math.max(0.7, Math.min(1.4, baseZoom + colorZoomOffset + densityZoomOffset));
            targetZoom = Math.max(0.4, Math.min(1.4, baseZoom + colorZoomOffset + densityZoomOffset));
            currentZoom += (targetZoom - currentZoom) * 0.08; // Faster interpolation
            
            if (!isHolding) {
                player.isDashing = false;
            }

            // Apply gravity
            if (player.isDashing) {
                player.dy = 0;
            } else if (player.mode === 'cube' || player.mode === 'ball') {
                player.dy += GRAVITY * player.gravity;
            } else if (player.mode === 'ufo') {
                player.dy += (GRAVITY * 0.6) * player.gravity; // Lower gravity for UFO
            } else if (player.mode === 'ship') {
                if (isHolding) player.dy -= 0.5 * player.gravity;
                else player.dy += 0.5 * player.gravity;
                player.dy = Math.max(-7, Math.min(7, player.dy)); // Terminal velocity
            } else if (player.mode === 'wave') {
                if (isHolding) player.dy = -Math.abs(player.dx) * player.gravity;
                else player.dy = Math.abs(player.dx) * player.gravity;
            }
            
            // Save previous position for collision resolution
            const prevY = player.y;
            const prevX = player.x;

            // Move player
            player.x += player.dx;
            player.y += player.dy;
            cameraX = player.x - 150; // Keep player towards the left of the screen

            // Update Best Progress
            const progressPct = Math.floor(Math.max(0, Math.min(1, player.x / (levelEnd || 1))) * 100);
            if (!isPracticeMode) {
                if (progressPct > (currentLevel.bestProgress || 0)) {
                    const newProgress = progressPct - (currentLevel.bestProgress || 0);
                    const earnedOrbs = newProgress * 5; // 5 Orbs per 1% of new progress
                    totalOrbs += earnedOrbs;
                    localStorage.setItem("gd_orbs", totalOrbs);

                    currentLevel.bestProgress = progressPct;
                    savedProgress[`${currentCategoryIndex}-${currentLevelIndex}`] = progressPct;
                    localStorage.setItem("gd_progress", JSON.stringify(savedProgress));
                    checkSkinUnlocks('progress', progressPct);
                }
            } else {
                if (progressPct > (currentLevel.bestPracticeProgress || 0)) {
                    currentLevel.bestPracticeProgress = progressPct;
                    savedProgress[`${currentCategoryIndex}-${currentLevelIndex}-practice`] = progressPct;
                    localStorage.setItem("gd_progress", JSON.stringify(savedProgress));
                }
            }

            player.grounded = false;

            // Cube rotation logic (rotates in air, snaps when grounded)
            if (player.mode === 'cube' && !player.grounded) {
                player.rotation += 5 * player.gravity;
            } else if (player.mode === 'ship') {
                player.rotation = player.dy * 3 * player.gravity; // Tilt ship based on vertical speed
            } else if (player.mode === 'ufo') {
                player.rotation = player.dy * 2 * player.gravity; // Slight tilt
            } else if (player.mode === 'wave') {
                player.rotation = player.dy * 10 * player.gravity; // Match 45 degree angle visually
            } else if (player.mode === 'ball') {
                player.rotation += 8 * (player.gravity === 1 ? 1 : -1);
            }

            // Check collisions
            for (let obs of obstacles) {
                // AABB Collision bounds
                let hitBox = { x: obs.x, y: obs.y, w: obs.w, h: obs.h };
                
                // Make spike hitboxes smaller to be fair
                if (obs.type === 'spike') {
                    hitBox = { x: obs.x + 10, y: obs.y + 15, w: obs.w - 20, h: obs.h - 15 };
                } else if (obs.type === 'halfSpike') {
                    hitBox = { x: obs.x + 10, y: obs.y + 10, w: obs.w - 20, h: obs.h - 10 };
                } else if (obs.type === 'spikeDown') {
                    hitBox = { x: obs.x + 10, y: obs.y, w: obs.w - 20, h: obs.h - 15 };
                } else if (obs.type === 'halfSpikeDown') {
                    hitBox = { x: obs.x + 10, y: obs.y, w: obs.w - 20, h: obs.h - 10 };
                } else if (obs.type === 'orb' || obs.type === 'dashOrb') {
                    hitBox = { x: obs.x - 15, y: obs.y - 15, w: obs.w + 30, h: obs.h + 30 };
                }

                // Check intersection
                if (player.x < hitBox.x + hitBox.w && 
                    player.x + player.w > hitBox.x && 
                    player.y < hitBox.y + hitBox.h && 
                    player.y + player.h > hitBox.y) {
                    
                    if (obs.type === 'orb' || obs.type === 'dashOrb') {
                        // If player has a buffered jump, trigger the orb now!
                        if ((player.mode === 'cube' || player.mode === 'ball') && !obs.hit && player.jumpBuffered) {
                            if (obs.type === 'orb') {
                                player.dy = JUMP_FORCE * player.gravity;
                                player.grounded = false;
                                player.isDashing = false;
                                obs.hit = true;
                                setTimeout(() => obs.hit = false, 300);
                                player.jumpBuffered = false; // Consume buffer
                            } else if (obs.type === 'dashOrb') {
                                player.isDashing = true;
                                player.dy = 0;
                                player.grounded = false;
                                obs.hit = true;
                                setTimeout(() => obs.hit = false, 300);
                                player.jumpBuffered = false; // Consume buffer
                            }
                        }
                        continue;
                    } else if (obs.type === 'portalShip') {
                        if (player.mode !== 'ship') {
                            player.mode = 'ship';
                            player.w = 45; // 3x width
                            player.h = 15; // 1x height (1x3 aspect ratio)
                            player.dy = 0; // Stabilize movement
                        }
                        continue;
                    } else if (obs.type === 'portalUFO') {
                        if (player.mode !== 'ufo') {
                            player.mode = 'ufo';
                            player.w = 40; 
                            player.h = 24; 
                            player.dy = 0; 
                        }
                        continue;
                    } else if (obs.type === 'portalWave') {
                        if (player.mode !== 'wave') {
                            player.mode = 'wave';
                            player.w = 20; 
                            player.h = 20; 
                            player.dy = 0; 
                        }
                        continue;
                    } else if (obs.type === 'portalBall') {
                        if (player.mode !== 'ball') {
                            player.mode = 'ball';
                            player.w = 30; 
                            player.h = 30; 
                        }
                        continue;
                    } else if (obs.type === 'portalCube') {
                        if (player.mode !== 'cube') {
                            player.mode = 'cube';
                            player.w = 30; 
                            player.h = 30; 
                            player.rotation = Math.round(player.rotation / 90) * 90;
                        }
                        continue;
                    } else if (obs.type === 'portalGravityInvert') {
                        if (player.gravity !== -1) {
                            player.gravity = -1;
                            player.dy = -Math.abs(player.dy) * 0.5; // Slight push to the ceiling
                        }
                        continue;
                    } else if (obs.type === 'portalGravityNormal') {
                        if (player.gravity !== 1) {
                            player.gravity = 1;
                            player.dy = Math.abs(player.dy) * 0.5; // Slight push to the floor
                        }
                        continue;
                    } else if (obs.type === 'pad') {
                        if (!obs.hit) {
                            player.y = player.gravity === 1 ? obs.y - player.h : obs.y + obs.h; // Snap above pad to prevent block overrides
                            player.dy = JUMP_FORCE * 1.8 * player.gravity; // Give a stronger jump than normal
                            player.grounded = false;
                            obs.hit = true;
                            setTimeout(() => obs.hit = false, 300);
                        }
                        continue;
                    } else if (obs.type === 'redPad') {
                        if (!obs.hit) {
                            player.y = player.gravity === 1 ? obs.y - player.h : obs.y + obs.h; // Snap above pad to prevent block overrides
                            player.dy = JUMP_FORCE * 2.2 * player.gravity; // Give an even stronger jump
                            player.grounded = false;
                            obs.hit = true;
                            setTimeout(() => obs.hit = false, 300);
                        }
                        continue;
                    } else if (obs.type === 'coin') {
                    if (!isPracticeMode && !obs.collected) {
                            obs.collected = true;
                            coins++;
                        }
                        continue;
                    } else if (obs.type === 'spike' || obs.type === 'halfSpike' || obs.type === 'spikeDown' || obs.type === 'halfSpikeDown') {
                        die();
                        return;
                    } else if (obs.type === 'block') {
                        if (player.mode === 'wave') {
                            die();
                            return;
                        }
                        let landed = false;
                        let hitCeiling = false;
                        if (player.gravity === 1) {
                            if (prevY + player.h <= obs.y) landed = true;
                            else if (player.mode === 'ship' && prevY >= obs.y + obs.h) hitCeiling = true;
                        } else {
                            if (prevY >= obs.y + obs.h) landed = true;
                            else if (player.mode === 'ship' && prevY + player.h <= obs.y) hitCeiling = true;
                        }
                        
                        if (landed) {
                            player.isDashing = false;
                            player.y = player.gravity === 1 ? obs.y - player.h : obs.y + obs.h;
                            player.dy = 0;
                            player.grounded = true;
                            if (player.mode === 'cube') {
                                player.rotation = Math.round(player.rotation / 90) * 90;
                                if (player.jumpBuffered) {
                                    player.dy = JUMP_FORCE * player.gravity;
                                    player.grounded = false;
                                    player.jumpBuffered = false;
                                }
                            } else if (player.mode === 'ball') {
                                if (player.jumpBuffered) {
                                    player.gravity *= -1;
                                    player.grounded = false;
                                    player.jumpBuffered = false;
                                }
                            }
                        } else if (hitCeiling) {
                            player.isDashing = false;
                            player.y = player.gravity === 1 ? obs.y + obs.h : obs.y - player.h;
                            player.dy = 0;
                        } else {
                            die();
                            return;
                        }
                    }
                }
            }

            // Check Level End
            if (player.x > levelEnd) {
                gameState = "COMPLETE";
                bgMusic.pause();
            }
            
            // Screen Bounds (Floor & Ceiling)
            if (player.gravity === 1) {
                if (player.y > canvas.height - player.h) {
                    player.isDashing = false;
                    player.y = canvas.height - player.h;
                    player.dy = 0;
                    player.grounded = true;
                    if (player.mode === 'cube') {
                        player.rotation = Math.round(player.rotation / 90) * 90;
                        if (player.jumpBuffered) {
                            player.dy = JUMP_FORCE * player.gravity;
                            player.grounded = false;
                            player.jumpBuffered = false;
                        }
                    } else if (player.mode === 'ball') {
                        if (player.jumpBuffered) {
                            player.gravity *= -1;
                            player.grounded = false;
                            player.jumpBuffered = false;
                        }
                    }
                }
                if (player.mode === 'ship' && player.y < 0) { player.y = 0; player.dy = 0; }
            } else {
                if (player.y < 0) {
                    player.isDashing = false;
                    player.y = 0;
                    player.dy = 0;
                    player.grounded = true;
                    if (player.mode === 'cube') {
                        player.rotation = Math.round(player.rotation / 90) * 90;
                        if (player.jumpBuffered) {
                            player.dy = JUMP_FORCE * player.gravity;
                            player.grounded = false;
                            player.jumpBuffered = false;
                        }
                    } else if (player.mode === 'ball') {
                        if (player.jumpBuffered) {
                            player.gravity *= -1;
                            player.grounded = false;
                            player.jumpBuffered = false;
                        }
                    }
                }
                if (player.mode === 'ship' && player.y > canvas.height - player.h) { player.y = canvas.height - player.h; player.dy = 0; }
            }

            // --- AUTO CHECKPOINT ---
            if (isPracticeMode && gameState === "PLAYING" && player.grounded) {
                const lastCpX = checkpoints.length > 0 ? checkpoints[checkpoints.length - 1].x : 0;
                if (player.x - lastCpX > 500) {
                    placeCheckpoint();
                }
            }

            // --- PARTICLES ---
            let pX = player.x + player.w / 2;
            let pY = player.y + player.h / 2;
            
            if (player.mode === 'ship') {
                pX -= 15; // Trail behind the ship
            } else if (player.mode === 'ufo') {
                pY += 10 * player.gravity; // Trail from the bottom booster
            } else if (player.mode === 'wave') {
                pX -= 10; // Trail behind the wave dart
            } else if (player.grounded) {
                pY += 15 * player.gravity; // Trail from the bottom when sliding
            }
            
            const currentSkin = skins.find(s => s.id === equippedSkin) || skins[0];
            for (let i = 0; i < 2; i++) {
                particles.push({
                    x: pX - 4 + (Math.random() * 8 - 4),
                    y: pY - 4 + (Math.random() * 8 - 4),
                    size: Math.random() * 4 + 2,
                    life: 0.8,
                    decay: Math.random() * 0.04 + 0.02,
                    color: currentSkin.color
                });
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].life -= particles[i].decay;
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawCube(ctx, skin, x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = skin.color;
            ctx.fillRect(-size/2, -size/2, size, size);
            ctx.strokeStyle = "#fff"; ctx.lineWidth=2; ctx.strokeRect(-size/2, -size/2, size, size);
            ctx.fillStyle = "#000";
            if (skin.icon === "angry") {
                ctx.beginPath(); ctx.moveTo(-size*0.3, -size*0.3); ctx.lineTo(-size*0.1, -size*0.15); ctx.lineTo(size*0.1, -size*0.15); ctx.lineTo(size*0.3, -size*0.3); ctx.stroke();
                ctx.fillRect(-size*0.2, -size*0.1, size*0.15, size*0.15); ctx.fillRect(size*0.1, -size*0.1, size*0.15, size*0.15);
            } else if (skin.icon === "ninja") {
                ctx.fillStyle = "#111"; ctx.fillRect(-size/2, -size*0.2, size, size*0.4);
                ctx.fillStyle = "#fff"; ctx.fillRect(-size*0.2, -size*0.15, size*0.15, size*0.15); ctx.fillRect(size*0.1, -size*0.15, size*0.15, size*0.15);
            } else if (skin.icon === "shades") {
                ctx.fillStyle = "#000"; ctx.fillRect(-size*0.4, -size*0.2, size*0.8, size*0.3);
                ctx.fillStyle = "#fff"; ctx.fillRect(-size*0.2, -size*0.15, size*0.1, size*0.1); ctx.fillRect(size*0.1, -size*0.15, size*0.1, size*0.1);
            } else if (skin.icon === "robot") {
                ctx.fillStyle = "#000"; ctx.fillRect(-size*0.4, -size*0.15, size*0.8, size*0.3);
                ctx.fillStyle = skin.color; ctx.fillRect(-size*0.2, -size*0.05, size*0.15, size*0.15); ctx.fillRect(size*0.1, -size*0.05, size*0.15, size*0.15);
            } else {
                ctx.fillRect(-size*0.15, -size*0.15, size*0.3, size*0.3);
            }
            ctx.restore();
        }

        function drawShip(ctx, skin, x, y, w, h) {
            ctx.save();
            ctx.translate(x, y);
            
            const sIndex = skin.shipIndex || 0;
            const img = shipImages[sIndex];
            
            if (img && img.complete && img.naturalWidth > 0) {
                ctx.drawImage(img, -w/2, -h/2 - 5, w, h + 10);
            } else {
                // Fallback geometry drawing if image is missing/loading
                ctx.fillStyle = skin.color;
                ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
                if (skin.icon === "angry") {
                    ctx.beginPath(); ctx.moveTo(-w/2, -h/2); ctx.lineTo(w/2, 0); ctx.lineTo(-w/2, h/2); ctx.lineTo(-w/4, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = "#000"; ctx.beginPath(); ctx.moveTo(-w/8, -h/4); ctx.lineTo(w/4, 0); ctx.lineTo(-w/8, h/4); ctx.closePath(); ctx.fill();
                } else if (skin.icon === "ninja") {
                    ctx.beginPath(); ctx.moveTo(-w/2, 0); ctx.lineTo(0, -h/2); ctx.lineTo(w/2, 0); ctx.lineTo(0, h/2); ctx.closePath(); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = "#111"; ctx.fillRect(-w/4, -h/6, w/2, h/3);
                } else if (skin.icon === "shades") {
                    ctx.fillRect(-w/2, -h/3, w, h/1.5); ctx.strokeRect(-w/2, -h/3, w, h/1.5);
                    ctx.fillStyle = "#000"; ctx.fillRect(-w/4, -h/4, w/2, h/2);
                } else if (skin.icon === "robot") {
                    ctx.beginPath(); ctx.arc(0, 0, h/1.2, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = "#000"; ctx.fillRect(-w/4, -h/4, w/2, h/2);
                } else {
                    ctx.beginPath(); ctx.moveTo(-w/2, -h/2); ctx.lineTo(w/2, 0); ctx.lineTo(-w/2, h/2); ctx.closePath(); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = "#000"; ctx.fillRect(-w/4, -h/4, w/3, h/2);
                }
            }
            ctx.restore();
        }

                function drawUFO(ctx, skin, x, y, w, h) {
            ctx.save();
            ctx.translate(x, y);
            
            // Dome
            ctx.fillStyle = "rgba(200, 255, 255, 0.5)";
            ctx.beginPath(); ctx.arc(0, 0, w/2.5, Math.PI, 0); ctx.fill(); ctx.stroke();
            
            // Inside pilot (mini cube)
            ctx.save(); ctx.scale(0.5, 0.5); drawCube(ctx, skin, 0, -h/2.5, 30); ctx.restore();

            // Base
            ctx.fillStyle = skin.color;
            ctx.beginPath(); ctx.ellipse(0, 0, w/2, h/3, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
            
            // Detail dots
            ctx.fillStyle = "#fff";
            ctx.beginPath(); ctx.arc(-w/3, 0, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(w/3, 0, 2, 0, Math.PI*2); ctx.fill();
            
            ctx.restore();
        }

                function drawWave(ctx, skin, x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = skin.color;
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
            
            ctx.beginPath();
            ctx.moveTo(-size/2, -size/2); ctx.lineTo(size/2, 0); ctx.lineTo(-size/2, size/2); ctx.lineTo(-size/4, 0);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            
            ctx.fillStyle = "#000";
            ctx.beginPath();
            ctx.moveTo(-size/4, -size/4); ctx.lineTo(size/4, 0); ctx.lineTo(-size/4, size/4); ctx.closePath();
            ctx.fill();
            
            ctx.restore();
        }

        function drawBall(ctx, skin, x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            
            ctx.fillStyle = skin.color;
            ctx.beginPath();
            ctx.arc(0, 0, size/2, 0, Math.PI*2);
            ctx.fill();
            
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = "#000";
            ctx.beginPath();
            ctx.arc(0, 0, size/3, 0, Math.PI*2);
            ctx.fill();
            
            ctx.strokeStyle = skin.color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-size/3, 0); ctx.lineTo(size/3, 0);
            ctx.moveTo(0, -size/3); ctx.lineTo(0, size/3);
            ctx.stroke();

            ctx.fillStyle = "#fff";
            ctx.beginPath();
