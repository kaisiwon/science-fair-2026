        function drawSpider(ctx, skin, x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = skin.color;
            
            // Legs
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
            ctx.beginPath();
            // Front/Back legs
            ctx.moveTo(-size/4, 0); ctx.lineTo(-size*0.7, -size*0.4);
            ctx.moveTo(-size/4, 0); ctx.lineTo(-size*0.7, size*0.4);
            ctx.moveTo(size/4, 0); ctx.lineTo(size*0.7, -size*0.4);
            ctx.moveTo(size/4, 0); ctx.lineTo(size*0.7, size*0.4);
            ctx.stroke();
            
            // Inner leg joints
            ctx.beginPath();
            ctx.moveTo(-size/4, 0); ctx.lineTo(-size*0.5, -size*0.1);
            ctx.moveTo(-size/4, 0); ctx.lineTo(-size*0.5, size*0.1);
            ctx.moveTo(size/4, 0); ctx.lineTo(size*0.5, -size*0.1);
            ctx.moveTo(size/4, 0); ctx.lineTo(size*0.5, size*0.1);
            ctx.stroke();
            
            // Body
            ctx.fillRect(-size/2.5, -size/3, size*0.8, size*0.66);
            ctx.strokeStyle = "#fff"; ctx.lineWidth=2; ctx.strokeRect(-size/2.5, -size/3, size*0.8, size*0.66);
            
            // Face (re-use cube face but slightly squished)
            ctx.fillStyle = "#000";
            if (skin.icon === "angry") {
                ctx.beginPath(); ctx.moveTo(-size*0.2, -size*0.1); ctx.lineTo(-size*0.05, -size*0.05); ctx.lineTo(size*0.05, -size*0.05); ctx.lineTo(size*0.2, -size*0.1); ctx.stroke();
                ctx.fillRect(-size*0.15, 0, size*0.1, size*0.1); ctx.fillRect(size*0.05, 0, size*0.1, size*0.1);
            } else if (skin.icon === "ninja") {
                ctx.fillStyle = "#111"; ctx.fillRect(-size/2.5, -size*0.15, size*0.8, size*0.3);
                ctx.fillStyle = "#fff"; ctx.fillRect(-size*0.15, -size*0.1, size*0.1, size*0.1); ctx.fillRect(size*0.05, -size*0.1, size*0.1, size*0.1);
            } else if (skin.icon === "shades") {
                ctx.fillStyle = "#000"; ctx.fillRect(-size*0.3, -size*0.15, size*0.6, size*0.2);
                ctx.fillStyle = "#fff"; ctx.fillRect(-size*0.15, -size*0.1, size*0.08, size*0.08); ctx.fillRect(size*0.07, -size*0.1, size*0.08, size*0.08);
            } else if (skin.icon === "robot") {
                ctx.fillStyle = "#000"; ctx.fillRect(-size*0.3, -size*0.1, size*0.6, size*0.2);
                ctx.fillStyle = skin.color; ctx.fillRect(-size*0.15, -size*0.05, size*0.1, size*0.1); ctx.fillRect(size*0.05, -size*0.05, size*0.1, size*0.1);
            } else {
                ctx.fillRect(-size*0.15, -size*0.1, size*0.1, size*0.1);
                ctx.fillRect(size*0.05, -size*0.1, size*0.1, size*0.1);
            }
            
            ctx.restore();
        }

        // --- RENDERING ---
        function draw() {
            const currentLevel = levelCategories[currentCategoryIndex]?.levels[currentLevelIndex] || levelCategories[0].levels[0];
            
            // Clear screen & draw background
            ctx.fillStyle = currentLevel.bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // --- MASTER ZOOM WRAPPER ---
            ctx.save();
            
            // Apply Dynamic Camera Zoom centered on the player's X position and screen center Y
            ctx.translate(150, canvas.height / 2);
            if (gameState === "PLAYING" || gameState === "DEAD" || gameState === "PAUSED" || gameState === "COMPLETE") {
                ctx.scale(currentZoom, currentZoom);
            }
            ctx.translate(-150, -canvas.height / 2);

            // --- PARALLAX BACKGROUND ---
            ctx.save();
            
            // Layer 1: Far background grid (moves slowly)
            const parallaxSpeed1 = 0.2;
            const gridSize = 60;
            // Use modulo math to create an infinite scrolling wrap
            const offsetX1 = ((cameraX * parallaxSpeed1) % gridSize + gridSize) % gridSize;
            
            ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            const drawDistParallax = (canvas.width * 1.5) / currentZoom;
            const heightDistParallax = (canvas.height * 1.5) / currentZoom;
            for (let x = -offsetX1 - 200; x < drawDistParallax + gridSize; x += gridSize) {
                ctx.moveTo(x, -heightDistParallax);
                ctx.lineTo(x, canvas.height + heightDistParallax);
            }
            for (let y = -heightDistParallax; y < canvas.height + heightDistParallax; y += gridSize) {
                ctx.moveTo(-200, y);
                ctx.lineTo(drawDistParallax, y);
            }
            ctx.stroke();

            // Layer 2: Mid background silhouettes (moves slightly faster)
            const parallaxSpeed2 = 0.5;
            const shapeSpacing = 300;
            const offsetX2 = ((cameraX * parallaxSpeed2) % shapeSpacing + shapeSpacing) % shapeSpacing;
            
            ctx.fillStyle = currentLevel.blockColor;
            ctx.globalAlpha = 0.3; // Make it subtly blend with the background
            for (let x = -offsetX2 - 200; x < drawDistParallax + shapeSpacing; x += shapeSpacing) {
                ctx.fillRect(x + 50, canvas.height - 180, 120, 180);
                ctx.fillRect(x + 200, canvas.height - 250, 80, 250);
            }
            
            ctx.restore();

            ctx.save();
            ctx.translate(-cameraX, 0);

            const drawDist = canvas.width / currentZoom;
            // Draw obstacles
            for (let obs of obstacles) {
                // Only draw objects somewhat near the camera for performance
                if (obs.x < cameraX - TILE_SIZE * 2 || obs.x > cameraX + drawDist + TILE_SIZE * 2) continue;

                if (obs.type === 'block') {
                    ctx.fillStyle = currentLevel.blockColor;
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                    ctx.strokeStyle = "#fff";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
                    
                    // Pulse effect for blocks
                    const pulse = Math.abs(Math.sin(Date.now() / 220));
                    ctx.strokeStyle = `rgba(255, 255, 255, ${0.3 + pulse * 0.7})`;
                    ctx.lineWidth = 1 + pulse * 3;
                    ctx.strokeRect(obs.x + pulse, obs.y + pulse, obs.w - pulse * 2, obs.h - pulse * 2);
                } else if (obs.type === 'spike' || obs.type === 'halfSpike') {
                    ctx.fillStyle = "#e94560"; // Red spikes
                    ctx.beginPath();
                    ctx.moveTo(obs.x + obs.w / 2, obs.y); // Top
                    ctx.lineTo(obs.x + obs.w, obs.y + obs.h); // Bottom right
                    ctx.lineTo(obs.x, obs.y + obs.h); // Bottom left
                    ctx.closePath();
                    ctx.fill();
                    
                    ctx.strokeStyle = "#fff";
                    ctx.lineWidth = 1;
                    ctx.stroke();
                } else if (obs.type === 'spikeDown' || obs.type === 'halfSpikeDown') {
                    ctx.fillStyle = "#e94560"; // Red spikes
                    ctx.beginPath();
                    ctx.moveTo(obs.x + obs.w / 2, obs.y + obs.h); // Bottom point
                    ctx.lineTo(obs.x + obs.w, obs.y); // Top right
                    ctx.lineTo(obs.x, obs.y); // Top left
                    ctx.closePath();
                    ctx.fill();
                    
                    ctx.strokeStyle = "#fff";
                    ctx.lineWidth = 1;
                    ctx.stroke();
                } else if (obs.type === 'orb' || obs.type === 'dashOrb') {
                    const isDash = obs.type === 'dashOrb';
                    ctx.fillStyle = obs.hit ? "#fff" : (isDash ? "#00ff00" : "#f1c40f"); // Green for dash orb, Yellow for standard orb
                    ctx.beginPath();
                    ctx.arc(obs.x + obs.w / 2, obs.y + obs.h / 2, obs.w / 2 - 5, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = "#fff";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    // Draw outer pulsing ring
                    ctx.beginPath();
                    ctx.arc(obs.x + obs.w / 2, obs.y + obs.h / 2, obs.w / 2, 0, Math.PI * 2);
                    ctx.strokeStyle = isDash ? "rgba(0, 255, 0, 0.5)" : "rgba(241, 196, 15, 0.5)";
                    ctx.lineWidth = 3;
                    ctx.stroke();
                } else if (obs.type === 'portalShip') {
                    ctx.fillStyle = "rgba(255, 100, 200, 0.4)"; // Pink portal
                    ctx.beginPath();
                    ctx.ellipse(obs.x + obs.w / 2, obs.y + obs.h / 2, obs.w / 3, obs.h / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = "#ff00aa";
                    ctx.lineWidth = 4;
                    ctx.stroke();
                } else if (obs.type === 'portalUFO') {
                    ctx.fillStyle = "rgba(255, 165, 0, 0.4)"; // Orange portal
                    ctx.beginPath();
                    ctx.ellipse(obs.x + obs.w / 2, obs.y + obs.h / 2, obs.w / 3, obs.h / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = "#ffa500";
                    ctx.lineWidth = 4;
                    ctx.stroke();
                } else if (obs.type === 'portalWave') {
                    ctx.fillStyle = "rgba(0, 200, 255, 0.4)"; // Cyan portal
                    ctx.beginPath();
                    ctx.ellipse(obs.x + obs.w / 2, obs.y + obs.h / 2, obs.w / 3, obs.h / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = "#00c8ff";
                    ctx.lineWidth = 4;
                    ctx.stroke();
                } else if (obs.type === 'portalBall') {
                    ctx.fillStyle = "rgba(255, 50, 0, 0.4)"; // Red-Orange portal
                    ctx.beginPath();
                    ctx.ellipse(obs.x + obs.w / 2, obs.y + obs.h / 2, obs.w / 3, obs.h / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = "#ff3200";
                    ctx.lineWidth = 4;
                    ctx.stroke();
                } else if (obs.type === 'portalSpider') {
                    ctx.fillStyle = "rgba(255, 0, 255, 0.4)"; // Magenta portal
                    ctx.beginPath();
                    ctx.ellipse(obs.x + obs.w / 2, obs.y + obs.h / 2, obs.w / 3, obs.h / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = "#ff00ff";
                    ctx.lineWidth = 4;
                    ctx.stroke();
                } else if (obs.type === 'portalCube') {
                    ctx.fillStyle = "rgba(0, 255, 170, 0.4)"; // Green portal
                    ctx.beginPath();
                    ctx.ellipse(obs.x + obs.w / 2, obs.y + obs.h / 2, obs.w / 3, obs.h / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = "#00ffaa";
                    ctx.lineWidth = 4;
                    ctx.stroke();
                } else if (obs.type === 'portalGravityInvert') {
                    ctx.fillStyle = "rgba(255, 255, 0, 0.4)"; // Yellow portal
                    ctx.beginPath();
                    ctx.ellipse(obs.x + obs.w / 2, obs.y + obs.h / 2, obs.w / 3, obs.h / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "#ffff00";
                    ctx.lineWidth = 4;
                    ctx.stroke();
                } else if (obs.type === 'portalGravityNormal') {
                    ctx.fillStyle = "rgba(0, 100, 255, 0.4)"; // Blue portal
                    ctx.beginPath();
                    ctx.ellipse(obs.x + obs.w / 2, obs.y + obs.h / 2, obs.w / 3, obs.h / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "#0066ff";
                    ctx.lineWidth = 4;
                    ctx.stroke();
                } else if (obs.type === 'pad') {
                    ctx.fillStyle = obs.hit ? "#fff" : "#f1c40f"; // Yellow pad
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                    ctx.strokeStyle = "#fff";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
                    
                    // Inner line for detail
                    ctx.beginPath();
                    ctx.moveTo(obs.x + 5, obs.y + obs.h / 2);
                    ctx.lineTo(obs.x + obs.w - 5, obs.y + obs.h / 2);
                    ctx.strokeStyle = "#000";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else if (obs.type === 'redPad') {
                    ctx.fillStyle = obs.hit ? "#fff" : "#e94560"; // Red pad
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                    ctx.strokeStyle = "#fff";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
                    
                    // Inner line for detail
                    ctx.beginPath();
                    ctx.moveTo(obs.x + 5, obs.y + obs.h / 2);
                    ctx.lineTo(obs.x + obs.w - 5, obs.y + obs.h / 2);
                    ctx.strokeStyle = "#000";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else if (obs.type === 'coin' && !obs.collected) {
                    ctx.fillStyle = isPracticeMode ? "rgba(255, 221, 0, 0.3)" : "#ffdd00"; // Gold
                    ctx.beginPath();
                    ctx.arc(obs.x + obs.w / 2, obs.y + obs.h / 2, obs.w / 2, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = isPracticeMode ? "rgba(255, 255, 255, 0.3)" : "#fff";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    // Draw an inner 'C'
                    ctx.fillStyle = isPracticeMode ? "rgba(255, 255, 255, 0.3)" : "#fff";
                    ctx.font = "bold 14px Arial";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("C", obs.x + obs.w / 2, obs.y + obs.h / 2);
                    ctx.textBaseline = "alphabetic"; // Reset baseline
                }
            }

            // Draw End Line
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(levelEnd, 0);
            ctx.lineTo(levelEnd, canvas.height);
            ctx.stroke();

            // Draw Checkpoints
            if (isPracticeMode) {
                ctx.fillStyle = "rgba(0, 255, 100, 0.6)";
                for (let cp of checkpoints) {
                    if (cp.x < cameraX - TILE_SIZE * 2 || cp.x > cameraX + drawDist + TILE_SIZE * 2) continue;
                    ctx.beginPath();
                    ctx.moveTo(cp.x + 15, cp.y + 30);
                    ctx.lineTo(cp.x + 5, cp.y + 15);
                    ctx.lineTo(cp.x + 15, cp.y);
                    ctx.lineTo(cp.x + 25, cp.y + 15);
                    ctx.closePath();
                    ctx.fill();
                    ctx.strokeStyle = "#fff";
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }

            // Draw Particles
            for (let p of particles) {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }
            ctx.globalAlpha = 1.0;

            const currentSkin = skins.find(s => s.id === equippedSkin) || skins[0];
            
            // Draw Player
            if (gameState !== "DEAD") {
                ctx.save();
                // Move context to center of player to rotate correctly
                ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
                ctx.rotate((player.rotation * Math.PI) / 180);
                ctx.scale(1, player.gravity); // Flips the sprite upside down if gravity is inverted
                
                if (player.mode === 'cube') {
                    drawCube(ctx, currentSkin, 0, 0, player.w);
                } else if (player.mode === 'ship') {
                    drawShip(ctx, currentSkin, 0, 0, player.w, player.h);
                } else if (player.mode === 'ufo') {
                    drawUFO(ctx, currentSkin, 0, 0, player.w, player.h);
                } else if (player.mode === 'wave') {
                    drawWave(ctx, currentSkin, 0, 0, player.w);
                } else if (player.mode === 'ball') {
                    drawBall(ctx, currentSkin, 0, 0, player.w);
                }
                
                ctx.restore();
            } else {
                // Death explosion particles (simplified as scattered squares)
                ctx.fillStyle = currentSkin.color;
                ctx.fillRect(player.x - 10, player.y - 10, 10, 10);
                ctx.fillRect(player.x + 30, player.y - 15, 8, 8);
                ctx.fillRect(player.x - 5, player.y + 30, 12, 12);
                ctx.fillRect(player.x + 25, player.y + 25, 9, 9);
            }

            ctx.restore();
            
            ctx.restore(); // Restore MASTER ZOOM WRAPPER

            // --- UI OVERLAYS ---
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
            ctx.font = "20px Arial";
            ctx.textAlign = "left";
            
            if (gameState === "PLAYING" || gameState === "DEAD" || gameState === "PAUSED") {
                ctx.fillText(currentLevel.name, 20, 30);
                ctx.font = "16px Arial";
                ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
                ctx.fillText(currentLevel.song, 20, 50);
                ctx.fillText(`Attempt: ${attempts}`, 20, 75);

                if (isPracticeMode) {
                    ctx.fillStyle = "#00ffcc";
                    ctx.fillText("Practice Mode (Auto-CP) - Z: Place, X: Remove", 20, 95);
                }

            // Progress Bar
            const barWidth = 300;
            const barHeight = 15;
            const barX = (canvas.width - barWidth) / 2;
            const barY = 20;
            
            // Calculate percentage complete (clamp between 0 and 1)
            const progress = Math.max(0, Math.min(1, player.x / (levelEnd || 1)));
            
            ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
            ctx.fillRect(barX, barY, barWidth, barHeight);
            ctx.fillStyle = "#00ffcc"; 
            ctx.fillRect(barX, barY, barWidth * progress, barHeight);
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 2;
            ctx.strokeRect(barX, barY, barWidth, barHeight);

            // Draw Coins in Top Right
            if (!isPracticeMode) {
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.arc(canvas.width - 140 + (i * 30), 30, 10, 0, Math.PI * 2);
                    if (i < coins) {
                        ctx.fillStyle = "#ffdd00";
                        ctx.fill();
                    }
                    ctx.strokeStyle = "#ffdd00";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }

            // Draw Pause Button
            if (gameState === "PLAYING" || gameState === "PAUSED") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
                ctx.fillRect(canvas.width - 45, 15, 30, 30);
                ctx.fillStyle = "#fff";
                ctx.fillRect(canvas.width - 37, 22, 5, 16);
                ctx.fillRect(canvas.width - 28, 22, 5, 16);
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 2;
                ctx.strokeRect(canvas.width - 45, 15, 30, 30);
            }
            }

            // Game State Overlays
            ctx.textAlign = "center";
            if (gameState === "START") {
                if (menuState === "SHOP") {
                    if (shopVideoVisible && shopBgVideo.readyState >= 2) {
                        ctx.drawImage(shopBgVideo, 0, 0, canvas.width, canvas.height);
                    } else {
                        ctx.fillStyle = "#000";
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }
                } else if (menuState === "SKIN_SELECT" && skinBgImage.complete) {
                    ctx.drawImage(skinBgImage, 0, 0, canvas.width, canvas.height);
                }
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#fff";
                ctx.font = "40px Arial";
                ctx.fillText("Math Dash", canvas.width / 2, 80);
                
                if (menuState === "CATEGORY_SELECT") {
                    ctx.font = "16px Arial";
                    ctx.fillText("Select a Category", canvas.width / 2, 115);
                    
                    ctx.fillStyle = "#00ffff";
                    ctx.textAlign = "right";
                    ctx.font = "20px Arial";
                    ctx.fillText(`Orbs: ${totalOrbs}`, canvas.width - 20, 41);
                    ctx.textAlign = "center";
                
                    // Draw Category Buttons
                    levelCategories.forEach((cat, i) => {
                        const btnX = canvas.width / 2 - 150;
                        const btnY = 140 + i * 60;
                        
                        ctx.fillStyle = "#222";
                        ctx.fillRect(btnX, btnY, 300, 45);
                        ctx.strokeStyle = "#00ffcc";
                        ctx.lineWidth = 2;
                        ctx.strokeRect(btnX, btnY, 300, 45);
                        
                        ctx.fillStyle = "#fff";
                        ctx.font = "20px Arial";
                        ctx.fillText(cat.name, canvas.width / 2, btnY + 28);
                    });
                    
                    const editorBtnY = 140 + levelCategories.length * 60 + 20;
                    
                    // Level Editor Button
                    ctx.fillStyle = "#ff00aa";
                    ctx.fillRect(canvas.width / 2 - 150, editorBtnY, 140, 45);
                    ctx.strokeStyle = "#fff";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(canvas.width / 2 - 150, editorBtnY, 140, 45);
                    ctx.fillStyle = "#fff";
                    ctx.fillText("🛠️ Editor", canvas.width / 2 - 80, editorBtnY + 28);
                    
                    // Skins Button
                    ctx.fillStyle = "#00ffcc";
                    ctx.fillRect(canvas.width / 2 + 10, editorBtnY, 140, 45);
                    ctx.strokeRect(canvas.width / 2 + 10, editorBtnY, 140, 45);
                    ctx.fillStyle = "#000";
                    ctx.fillText("🎨 Skins", canvas.width / 2 + 80, editorBtnY + 28);
                } else if (menuState === "LEVEL_SELECT") {
                    ctx.font = "16px Arial";
                    ctx.fillText(levelCategories[currentCategoryIndex].name + " - Select a Level", canvas.width / 2, 115);
                    
                    // Draw Back Button
                    ctx.fillStyle = "#e94560";
                    ctx.fillRect(20, 20, 80, 30);
                    ctx.fillStyle = "#fff";
                    ctx.font = "16px Arial";
                    ctx.fillText("Back", 60, 41);
                    
                    ctx.fillStyle = "#00ffff";
                    ctx.textAlign = "right";
                    ctx.font = "20px Arial";
                    ctx.fillText(`Orbs: ${totalOrbs}`, canvas.width - 20, 41);
                    ctx.textAlign = "center";
                
                    const levels = levelCategories[currentCategoryIndex].levels;
                    
                    // Smooth slide animation
                    const targetScrollX = currentLevelIndex * canvas.width;
                    menuScrollX += (targetScrollX - menuScrollX) * 0.15;
                    
                    ctx.save();
                    
                    for (let i = 0; i < levels.length; i++) {
                        const lvl = levels[i];
                        const xOffset = i * canvas.width - menuScrollX;
                        
                        // Only draw if relatively on-screen
                        if (Math.abs(xOffset) > canvas.width) continue;

                        // Draw Level Info Box
                        ctx.fillStyle = "#222";
                        ctx.fillRect(canvas.width / 2 - 200 + xOffset, 125, 400, 180);
                        ctx.strokeStyle = "#00ffcc";
                        ctx.lineWidth = 3;
                        ctx.strokeRect(canvas.width / 2 - 200 + xOffset, 125, 400, 180);
                        
                        ctx.fillStyle = "#fff";
                        ctx.font = "24px Arial";
                        ctx.fillText(lvl.name, canvas.width / 2 + xOffset, 160);
                        
                        ctx.font = "16px Arial";
                        ctx.fillStyle = "#aaa";
                        ctx.fillText("Song: " + (lvl.song || "Unknown"), canvas.width / 2 + xOffset, 185);
                        
                        // Normal Mode Progress
                        const bestProg = lvl.bestProgress || 0;
                        ctx.font = "14px Arial";
                        ctx.fillStyle = "#fff";
                        ctx.fillText(`Normal: ${bestProg}%`, canvas.width / 2 - 85 + xOffset, 210);

                        const progBarWidth = 140;
                        const progBarX = canvas.width / 2 - 155 + xOffset;
                        const progBarY = 220;
                        
                        ctx.fillStyle = "#111";
                        ctx.fillRect(progBarX, progBarY, progBarWidth, 10);
                        ctx.fillStyle = "#00ffcc";
                        ctx.fillRect(progBarX, progBarY, progBarWidth * (bestProg / 100), 10);
                        ctx.strokeStyle = "#444";
                        ctx.lineWidth = 2;
                        ctx.strokeRect(progBarX, progBarY, progBarWidth, 10);
                        
                        // Practice Mode Progress
                        const bestPracProg = lvl.bestPracticeProgress || 0;
                        ctx.fillStyle = "#fff";
                        ctx.fillText(`Practice: ${bestPracProg}%`, canvas.width / 2 + 85 + xOffset, 210);

                        const pracBarX = canvas.width / 2 + 15 + xOffset;
                        
                        ctx.fillStyle = "#111";
                        ctx.fillRect(pracBarX, progBarY, progBarWidth, 10);
                        ctx.fillStyle = "#00ffcc";
                        ctx.fillRect(pracBarX, progBarY, progBarWidth * (bestPracProg / 100), 10);
                        ctx.strokeStyle = "#444";
                        ctx.lineWidth = 2;
                        ctx.strokeRect(pracBarX, progBarY, progBarWidth, 10);
                        
                        // Draw Play Button
                        const playBtnX = canvas.width / 2 - 160 + xOffset;
                        const playBtnY = 245;
                        ctx.fillStyle = "#00ffcc";
                        ctx.fillRect(playBtnX, playBtnY, 150, 40);
                        ctx.fillStyle = "#000";
                        ctx.font = "bold 20px Arial";
                        ctx.fillText("PLAY", canvas.width / 2 - 85 + xOffset, playBtnY + 27);
                        
                        // Draw Practice Button
                        const pracBtnX = canvas.width / 2 + 10 + xOffset;
                        ctx.fillStyle = "#00ffcc";
                        ctx.fillRect(pracBtnX, playBtnY, 150, 40);
                        ctx.fillStyle = "#000";
                        ctx.font = "bold 20px Arial";
                        ctx.fillText("PRACTICE", canvas.width / 2 + 85 + xOffset, playBtnY + 27);
                    }
                    
                    ctx.restore();

                    // Draw Left Arrow (drawn over the sliding boxes)
                    if (levels.length > 1) {
                        ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
                        ctx.fillRect(50, 180, 50, 70);
                        ctx.fillStyle = "#fff";
                        ctx.font = "30px Arial";
                        ctx.fillText("<", 75, 225);
                        
                        // Draw Right Arrow
                        ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
                        ctx.fillRect(canvas.width - 100, 180, 50, 70);
                        ctx.fillStyle = "#fff";
                        ctx.fillText(">", canvas.width - 75, 225);
                    }
                } else if (menuState === "SKIN_SELECT") {
                    ctx.font = "16px Arial";
                    ctx.fillText("Select a Skin", canvas.width / 2, 115);
                    
                    ctx.fillStyle = "#e94560";
                    ctx.fillRect(20, 20, 80, 30);
                    ctx.fillStyle = "#fff";
                    ctx.font = "16px Arial";
                    ctx.fillText("Back", 60, 41);
                    
                    ctx.fillStyle = "#00ffff";
                    ctx.textAlign = "right";
                    ctx.font = "20px Arial";
                    ctx.fillText(`Orbs: ${totalOrbs}`, canvas.width - 150, 41); // slightly offset because of Shop button
                    ctx.textAlign = "center";
                
                    const shopBtnX = canvas.width - 140;
                    const shopBtnY = 20;
                    ctx.fillStyle = "#ffaa00"; ctx.fillRect(shopBtnX, shopBtnY, 120, 40);
                    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.strokeRect(shopBtnX, shopBtnY, 120, 40);
                    ctx.fillStyle = "#000"; ctx.font = "bold 16px Arial"; ctx.fillText("The Shop", shopBtnX + 60, shopBtnY + 26);
                    
                    const displayIndex = hoveredSkinIndex !== -1 ? hoveredSkinIndex : currentSkinIndex;
                    const displaySkin = skins[displayIndex];
                    if (!displaySkin) return;
                    const isUnlocked = unlockedSkins.includes(displaySkin.id);

                    // Draw Grid with pagination
                    for (let i = 0; i < skins.length; i++) {
                        if (i < skinPage * 12 || i >= (skinPage + 1) * 12) continue;
                        const idxOnPage = i % 12;
                        const skin = skins[i];
                        const col = idxOnPage % 4;
                        const row = Math.floor(idxOnPage / 4);
                        const boxX = 80 + col * 70;
                        const boxY = 140 + row * 70;

                        ctx.fillStyle = (i === currentSkinIndex) ? "#333" : "#222";
                        ctx.fillRect(boxX, boxY, 50, 50);

                        if (equippedSkin === skin.id) {
                            ctx.strokeStyle = "#00ffaa";
                            ctx.lineWidth = 3;
                        } else if (i === currentSkinIndex || i === hoveredSkinIndex) {
                            ctx.strokeStyle = "#fff";
                            ctx.lineWidth = 2;
                        } else {
                            ctx.strokeStyle = "#00ffcc";
                            ctx.lineWidth = 2;
                        }
                        ctx.strokeRect(boxX, boxY, 50, 50);

                        ctx.save();
                        ctx.translate(boxX + 25, boxY + 25);
                        if (!unlockedSkins.includes(skin.id)) ctx.filter = "brightness(0.3)";
                        drawCube(ctx, skin, 0, 0, 25);
                        ctx.restore();
                    }
                    
                    if (skins.length > 12) {
                        ctx.fillStyle = skinPage > 0 ? "rgba(0, 255, 204, 0.8)" : "rgba(68, 68, 68, 0.8)";
                        ctx.fillRect(30, 210, 30, 40);
                        ctx.fillStyle = "#000"; ctx.font = "20px Arial"; ctx.fillText("<", 45, 238);

                        ctx.fillStyle = skinPage < Math.ceil(skins.length/12) - 1 ? "rgba(0, 255, 204, 0.8)" : "rgba(68, 68, 68, 0.8)";
                        ctx.fillRect(360, 210, 30, 40);
                        ctx.fillStyle = "#000"; ctx.fillText(">", 375, 238);
                        
                        ctx.fillStyle = "#fff"; ctx.font = "14px Arial";
                        ctx.fillText(`Page ${skinPage + 1} / ${Math.ceil(skins.length/12)}`, 210, 370);
                    }

                    // Draw Detail Panel
                    const panelX = 420;
                    const panelY = 130;
                    ctx.fillStyle = "#222";
                    ctx.fillRect(panelX, panelY, 300, 240);
                    ctx.strokeStyle = "#00ffcc";
                    ctx.lineWidth = 3;
                    ctx.strokeRect(panelX, panelY, 300, 240);

                    ctx.fillStyle = "#fff";
                    ctx.font = "24px Arial";
                    ctx.fillText(displaySkin.name, panelX + 150, panelY + 35);

                    ctx.save();
                    ctx.translate(panelX + 150, panelY + 100);
                    if (!isUnlocked) ctx.filter = "brightness(0.3)";
                    drawCube(ctx, displaySkin, -35, 0, 45);
                    drawShip(ctx, displaySkin, 35, 0, 55, 20);
                    ctx.restore();

                    ctx.fillStyle = isUnlocked ? "#00ffaa" : "#aaa";
                    ctx.font = "14px Arial";
                    ctx.fillText(isUnlocked ? "Unlocked!" : displaySkin.conditionText, panelX + 150, panelY + 170);

                    const btnX = panelX + 35;
                    const btnY = panelY + 190;
                    if (equippedSkin === displaySkin.id) {
                        ctx.fillStyle = "#00ffaa"; ctx.fillRect(btnX, btnY, 230, 40);
                        ctx.fillStyle = "#000"; ctx.font = "bold 18px Arial"; ctx.fillText("EQUIPPED", panelX + 150, btnY + 26);
                    } else if (isUnlocked) {
                        ctx.fillStyle = "#00ffcc"; ctx.fillRect(btnX, btnY, 230, 40);
                        ctx.fillStyle = "#000"; ctx.font = "bold 18px Arial"; ctx.fillText("EQUIP", panelX + 150, btnY + 26);
                    } else {
                        ctx.fillStyle = "#444"; ctx.fillRect(btnX, btnY, 230, 40);
                        ctx.fillStyle = "#aaa"; ctx.font = "bold 16px Arial"; ctx.fillText("LOCKED", panelX + 150, btnY + 26);
                    }
                } else if (menuState === "SHOP") {
                    ctx.font = "16px Arial";
                    ctx.fillText("The Shop - Spend your Orbs!", canvas.width / 2, 115);
                    
                    ctx.fillStyle = "#e94560";
                    ctx.fillRect(20, 20, 80, 30);
                    ctx.fillStyle = "#fff";
                    ctx.font = "16px Arial";
                    ctx.fillText("Back", 60, 41);

                    ctx.fillStyle = "#00ffff";
                    ctx.textAlign = "right";
                    ctx.font = "20px Arial";
                    ctx.fillText(`Orbs: ${totalOrbs}`, canvas.width - 20, 41);
                    ctx.textAlign = "center";
                    
                    const shopSkins = skins.filter(s => s.cost);
                    if (shopSkins.length === 0) return;

                    const displayIndex = hoveredShopIndex !== -1 ? hoveredShopIndex : currentShopIndex;
                    if (displayIndex < 0 || displayIndex >= shopSkins.length) return;
                    const displaySkin = shopSkins[displayIndex];
                    const isUnlocked = unlockedSkins.includes(displaySkin.id);

                    // Draw Grid with pagination
                    for (let i = 0; i < shopSkins.length; i++) {
                        if (i < shopPage * 12 || i >= (shopPage + 1) * 12) continue;
                        const idxOnPage = i % 12;
                        const skin = shopSkins[i];
                        const col = idxOnPage % 4;
                        const row = Math.floor(idxOnPage / 4);
                        const boxX = 80 + col * 70;
                        const boxY = 140 + row * 70;

                        ctx.fillStyle = (i === currentShopIndex) ? "#333" : "#222";
                        ctx.fillRect(boxX, boxY, 50, 50);

                        if (equippedSkin === skin.id) {
                            ctx.strokeStyle = "#00ffaa";
                            ctx.lineWidth = 3;
                        } else if (i === currentShopIndex || i === hoveredShopIndex) {
                            ctx.strokeStyle = "#fff";
                            ctx.lineWidth = 2;
                        } else {
                            ctx.strokeStyle = "#00ffcc";
                            ctx.lineWidth = 2;
                        }
                        ctx.strokeRect(boxX, boxY, 50, 50);

                        ctx.save();
                        ctx.translate(boxX + 25, boxY + 25);
                        if (!unlockedSkins.includes(skin.id)) ctx.filter = "brightness(0.3)";
                        drawCube(ctx, skin, 0, 0, 25);
                        ctx.restore();
                    }

                    if (shopSkins.length > 12) {
                        ctx.fillStyle = shopPage > 0 ? "rgba(0, 255, 204, 0.8)" : "rgba(68, 68, 68, 0.8)";
                        ctx.fillRect(30, 210, 30, 40);
                        ctx.fillStyle = "#000"; ctx.font = "20px Arial"; ctx.fillText("<", 45, 238);

                        ctx.fillStyle = shopPage < Math.ceil(shopSkins.length/12) - 1 ? "rgba(0, 255, 204, 0.8)" : "rgba(68, 68, 68, 0.8)";
                        ctx.fillRect(360, 210, 30, 40);
                        ctx.fillStyle = "#000"; ctx.fillText(">", 375, 238);
                        
                        ctx.fillStyle = "#fff"; ctx.font = "14px Arial";
                        ctx.fillText(`Page ${shopPage + 1} / ${Math.ceil(shopSkins.length/12)}`, 210, 370);
                    }

                    // Draw Detail Panel
                    const panelX = 420;
                    const panelY = 130;
                    ctx.fillStyle = "#222";
                    ctx.fillRect(panelX, panelY, 300, 240);
                    ctx.strokeStyle = "#00ffcc";
                    ctx.lineWidth = 3;
                    ctx.strokeRect(panelX, panelY, 300, 240);

                    ctx.fillStyle = "#fff";
                    ctx.font = "24px Arial";
                    ctx.fillText(displaySkin.name, panelX + 150, panelY + 35);

                    ctx.save();
                    ctx.translate(panelX + 150, panelY + 100);
                    if (!isUnlocked) ctx.filter = "brightness(0.3)";
                    drawCube(ctx, displaySkin, -35, 0, 45);
                    drawShip(ctx, displaySkin, 35, 0, 55, 20);
                    ctx.restore();

                    ctx.fillStyle = isUnlocked ? "#00ffaa" : "#00ffff";
                    ctx.font = "14px Arial";
                    ctx.fillText(isUnlocked ? "Purchased!" : `Cost: ${displaySkin.cost} Orbs`, panelX + 150, panelY + 170);

                    const btnX = panelX + 35;
                    const btnY = panelY + 190;
                    if (equippedSkin === displaySkin.id) {
                        ctx.fillStyle = "#00ffaa"; ctx.fillRect(btnX, btnY, 230, 40);
                        ctx.fillStyle = "#000"; ctx.font = "bold 18px Arial"; ctx.fillText("EQUIPPED", panelX + 150, btnY + 26);
                    } else if (isUnlocked) {
                        ctx.fillStyle = "#00ffcc"; ctx.fillRect(btnX, btnY, 230, 40);
                        ctx.fillStyle = "#000"; ctx.font = "bold 18px Arial"; ctx.fillText("EQUIP", panelX + 150, btnY + 26);
                    } else if (totalOrbs >= displaySkin.cost) {
                        ctx.fillStyle = "#00ffff"; ctx.fillRect(btnX, btnY, 230, 40);
                        ctx.fillStyle = "#000"; ctx.font = "bold 18px Arial"; ctx.fillText("BUY", panelX + 150, btnY + 26);
                    } else {
                        ctx.fillStyle = "#444"; ctx.fillRect(btnX, btnY, 230, 40);
                        ctx.fillStyle = "#aaa"; ctx.font = "bold 16px Arial"; ctx.fillText("NOT ENOUGH ORBS", panelX + 150, btnY + 26);
                    }
                }
            } else if (gameState === "PAUSED") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00ffcc";
                ctx.font = "40px Arial";
                ctx.fillText("PAUSED", canvas.width / 2, 100);
                
                const btnWidth = 200;
                const btnHeight = 45;
                const startX = canvas.width / 2 - btnWidth / 2;
                
                // Continue Button
                ctx.fillStyle = "#222";
                ctx.fillRect(startX, 150, btnWidth, btnHeight);
                ctx.strokeStyle = "#00ffcc";
                ctx.lineWidth = 2;
                ctx.strokeRect(startX, 150, btnWidth, btnHeight);
                ctx.fillStyle = "#fff";
                ctx.font = "20px Arial";
                ctx.fillText("Continue", canvas.width / 2, 150 + 28);
                
                // Practice Mode Button
                ctx.fillStyle = "#222";
                ctx.fillRect(startX, 210, btnWidth, btnHeight);
                ctx.strokeRect(startX, 210, btnWidth, btnHeight);
                ctx.fillStyle = "#fff";
                ctx.fillText(isPracticeMode ? "Normal Mode" : "Practice Mode", canvas.width / 2, 210 + 28);
                
                const isCustom = levelCategories[currentCategoryIndex].levels[currentLevelIndex].isUserCreated;
                if (isCustom) {
                    // Edit Level
                    ctx.fillStyle = "#222"; ctx.fillRect(startX, 270, btnWidth, btnHeight);
                    ctx.strokeRect(startX, 270, btnWidth, btnHeight);
                    ctx.fillStyle = "#ff00aa"; ctx.fillText("Edit Level", canvas.width / 2, 270 + 28);
                    
                    // Leave
                    ctx.fillStyle = "#222"; ctx.fillRect(startX, 330, btnWidth, btnHeight);
                    ctx.strokeRect(startX, 330, btnWidth, btnHeight);
                    ctx.fillStyle = "#e94560"; ctx.fillText("Leave", canvas.width / 2, 330 + 28);
                } else {
                    // Leave Button
                    ctx.fillStyle = "#222";
                    ctx.fillRect(startX, 270, btnWidth, btnHeight);
                    ctx.strokeRect(startX, 270, btnWidth, btnHeight);
                    ctx.fillStyle = "#e94560";
                    ctx.fillText("Leave", canvas.width / 2, 270 + 28);
                }
            } else if (gameState === "EDITOR") {
                ctx.fillStyle = "#1a1a2e";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.save();
                ctx.translate(-editorCameraX, 0);
                
                // Draw grid lines
                ctx.strokeStyle = "rgba(255,255,255,0.1)";
                ctx.lineWidth = 1;
                for(let r=1; r<=10; r++) {
                    ctx.beginPath(); ctx.moveTo(editorCameraX, r*TILE_SIZE); ctx.lineTo(editorCameraX+canvas.width, r*TILE_SIZE); ctx.stroke();
                }
                const startCol = Math.floor(editorCameraX/TILE_SIZE);
                for(let c=startCol; c<=startCol+25; c++) {
                    ctx.beginPath(); ctx.moveTo(c*TILE_SIZE, 40); ctx.lineTo(c*TILE_SIZE, 400); ctx.stroke();
                }

                // Draw placed blocks
                for (let row = 0; row < 10; row++) {
                    for (let col = startCol; col <= startCol+25; col++) {
                        if (col >= editorLayout[row].length) continue;
                        let char = editorLayout[row][col];
                        let x = col * TILE_SIZE;
                        let y = row * TILE_SIZE;
                        
                        if (char === 'X') {
                            ctx.fillStyle = "#0f3460"; ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                            ctx.strokeStyle = "#fff"; ctx.strokeRect(x, y, TILE_SIZE, TILE_SIZE);
                        } else if (char === '^') {
                            ctx.fillStyle = "#e94560";
                            ctx.beginPath(); ctx.moveTo(x+TILE_SIZE/2, y); ctx.lineTo(x+TILE_SIZE, y+TILE_SIZE); ctx.lineTo(x, y+TILE_SIZE); ctx.fill(); ctx.stroke();
                        } else if (char === 'O') {
                            ctx.fillStyle = "#f1c40f";
                            ctx.beginPath(); ctx.arc(x+TILE_SIZE/2, y+TILE_SIZE/2, TILE_SIZE/2-5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                        } else if (char === 'D') {
                            ctx.fillStyle = "#00ff00";
                            ctx.beginPath(); ctx.arc(x+TILE_SIZE/2, y+TILE_SIZE/2, TILE_SIZE/2-5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                        } else if (char === 'P') {
                            ctx.fillStyle = "#f1c40f"; ctx.fillRect(x, y+TILE_SIZE*0.75, TILE_SIZE, TILE_SIZE*0.25); ctx.strokeRect(x, y+TILE_SIZE*0.75, TILE_SIZE, TILE_SIZE*0.25);
                        } else if (char === '>') {
                            ctx.fillStyle = "rgba(255,100,200,0.4)"; ctx.beginPath(); ctx.ellipse(x+TILE_SIZE/2, y+TILE_SIZE/2, TILE_SIZE/3, TILE_SIZE/2, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                        } else if (char === 'U') {
                            ctx.fillStyle = "rgba(255,165,0,0.4)"; ctx.beginPath(); ctx.ellipse(x+TILE_SIZE/2, y+TILE_SIZE/2, TILE_SIZE/3, TILE_SIZE/2, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                        } else if (char === 'W') {
                            ctx.fillStyle = "rgba(0,200,255,0.4)"; ctx.beginPath(); ctx.ellipse(x+TILE_SIZE/2, y+TILE_SIZE/2, TILE_SIZE/3, TILE_SIZE/2, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                        } else if (char === 'Q') {
                            ctx.fillStyle = "rgba(255,50,0,0.4)"; ctx.beginPath(); ctx.ellipse(x+TILE_SIZE/2, y+TILE_SIZE/2, TILE_SIZE/3, TILE_SIZE/2, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                        } else if (char === '<') {
                            ctx.fillStyle = "rgba(0,255,170,0.4)"; ctx.beginPath(); ctx.ellipse(x+TILE_SIZE/2, y+TILE_SIZE/2, TILE_SIZE/3, TILE_SIZE/2, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                        } else if (char === '@') {
                            ctx.strokeStyle = "#00ffcc"; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x+TILE_SIZE/2, 0); ctx.lineTo(x+TILE_SIZE/2, 400); ctx.stroke();
                        }
                    }
                }
                ctx.restore();

                // Draw UI Top Bar
                ctx.fillStyle = "#222";
                ctx.fillRect(0, 0, canvas.width, 40);
                
                // Save Play
                ctx.fillStyle = "#00ffcc"; ctx.fillRect(10, 5, 100, 30);
                ctx.fillStyle = "#000"; ctx.font = "bold 14px Arial"; ctx.fillText("Save & Play", 60, 25);
                
                // Exit
                ctx.fillStyle = "#e94560"; ctx.fillRect(120, 5, 60, 30);
                ctx.fillStyle = "#fff"; ctx.fillText("Exit", 150, 25);
                
                // Brushes
                brushes.forEach((b, i) => {
                    ctx.fillStyle = i === currentBrushIndex ? "#00ffcc" : "#444";
                    ctx.fillRect(200 + i * 40, 5, 30, 30);
                    ctx.fillStyle = i === currentBrushIndex ? "#000" : "#fff";
                    ctx.font = "16px Arial";
                    ctx.fillText(b.char, 215 + i * 40, 25);
                });
                
                ctx.fillStyle = "#fff";
                ctx.textAlign = "left";
                ctx.fillText("Brush: " + brushes[currentBrushIndex].name + " (Use A/D to Pan)", 200 + brushes.length * 40 + 10, 25);
            } else if (gameState === "COMPLETE") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#00ffcc";
                ctx.font = "40px Arial";
                ctx.fillText("LEVEL COMPLETE!", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "#fff";
                ctx.font = "20px Arial";
                ctx.fillText(`Attempts: ${attempts}`, canvas.width / 2, canvas.height / 2 + 20);
            if (attemptOrbs > 0) {
                ctx.fillStyle = "#00ffff";
                ctx.fillText(`+${attemptOrbs} Orbs!`, canvas.width / 2, canvas.height / 2 + 50);
                ctx.fillStyle = "#aaa";
                ctx.fillText("Click or Press Space to Return to Menu", canvas.width / 2, canvas.height / 2 + 90);
            } else {
                ctx.fillStyle = "#aaa";
                ctx.fillText("Click or Press Space to Return to Menu", canvas.width / 2, canvas.height / 2 + 60);
            }
            } else if (gameState === "ALL_CLEAR") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ffcc00";
                ctx.font = "40px Arial";
                ctx.fillText("YOU BEAT THE GAME!", canvas.width / 2, canvas.height / 2);
            }

            // Draw Skin Unlock Popup overlay
            if (skinUnlockPopup) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#fff";
                ctx.font = "30px Arial";
                ctx.textAlign = "center";
                ctx.fillText("NEW SKIN UNLOCKED!", canvas.width / 2, 100);
                
                ctx.fillStyle = skinUnlockPopup.color;
                ctx.font = "24px Arial";
                ctx.fillText(skinUnlockPopup.name, canvas.width / 2, 140);
                
                ctx.save();
                ctx.translate(canvas.width / 2, 190);
                ctx.scale(1.5, 1.5);
                ctx.fillStyle = skinUnlockPopup.color;
                ctx.fillRect(-20, -20, 40, 40);
                ctx.strokeStyle = "#fff"; ctx.lineWidth=2; ctx.strokeRect(-20,-20,40,40);
                ctx.fillStyle = "#000";
                if (skinUnlockPopup.icon === "angry") {
                    ctx.beginPath(); ctx.moveTo(-10, -10); ctx.lineTo(-3, -5); ctx.lineTo(3, -5); ctx.lineTo(10, -10); ctx.stroke();
                    ctx.fillRect(-8, -3, 5, 5); ctx.fillRect(3, -3, 5, 5);
                } else if (skinUnlockPopup.icon === "ninja") {
                    ctx.fillStyle = "#111"; ctx.fillRect(-20, -8, 40, 16);
                    ctx.fillStyle = "#fff"; ctx.fillRect(-8, -5, 5, 5); ctx.fillRect(3, -5, 5, 5);
                } else if (skinUnlockPopup.icon === "shades") {
                    ctx.fillStyle = "#000"; ctx.fillRect(-12, -8, 24, 10);
                    ctx.fillStyle = "#fff"; ctx.fillRect(-8, -5, 3, 3); ctx.fillRect(5, -5, 3, 3);
                } else if (skinUnlockPopup.icon === "robot") {
                    ctx.fillStyle = "#000"; ctx.fillRect(-12, -6, 24, 12);
                    ctx.fillStyle = skinUnlockPopup.color; ctx.fillRect(-8, -3, 5, 5); ctx.fillRect(3, -3, 5, 5);
                } else {
                    ctx.fillRect(-7, -7, 14, 14);
                }
                ctx.restore();
                
                ctx.fillStyle = "#00ffaa";
                ctx.fillRect(canvas.width/2 - 110, 250, 100, 40);
                ctx.fillStyle = "#000"; ctx.font = "bold 16px Arial";
                ctx.fillText("Equip", canvas.width/2 - 60, 276);
                
                ctx.fillStyle = "#e94560";
                ctx.fillRect(canvas.width/2 + 10, 250, 100, 40);
                ctx.fillStyle = "#fff";
                ctx.fillText("Keep Current", canvas.width/2 + 60, 276);
            }
        }

        // --- MAIN GAME LOOP ---
        function gameLoop() {
            if (!skinUnlockPopup && newUnlockedSkinQueue.length > 0 && gameState !== "PLAYING" && gameState !== "EDITOR") {
                skinUnlockPopup = newUnlockedSkinQueue.shift();
            }
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Initialize and start loop
        loadLevel(0, 0);
        // returnToMenu() is called from the startBtn click handler to bypass autoplay restrictions
        gameLoop();
    </script>
</body>
</html>
